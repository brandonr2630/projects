name: Deploy to cPanel

on:
  workflow_call:
    inputs:
      deploy_dir:
        description: Absolute path on the server to deploy into
        required: true
        type: string
      exclude_extra:
        description: Additional grep -Ev pattern to exclude files from deploy
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload changed files to cPanel
        env:
          TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          HOST="${{ secrets.CPANEL_HOST }}"
          CPANEL_USER="${{ secrets.CPANEL_USER }}"
          DEPLOY_DIR="${{ inputs.deploy_dir }}"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # workflow_dispatch has no BEFORE; treat as full deploy
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only --diff-filter=ACM "$BEFORE" "$AFTER")
          fi

          EXCLUDE="^\.github/|^\.cpanel\.yml$|^handoff\.md$|^CLAUDE\.md$"
          if [ -n "${{ inputs.exclude_extra }}" ]; then
            EXCLUDE="${EXCLUDE}|${{ inputs.exclude_extra }}"
          fi
          FILES=$(echo "$FILES" | grep -Ev "$EXCLUDE" || true)

          if [ -z "$FILES" ]; then
            echo "No deployable files changed. Done."
            exit 0
          fi

          echo "=== Files to deploy ==="
          echo "$FILES"
          echo "======================"

          # Create required subdirectories before uploading (ignore errors if already exist)
          declare -A SEEN_DIRS
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            SUBDIR=$(dirname "$file")
            [ "$SUBDIR" = "." ] && continue
            CURRENT=""
            IFS='/' read -ra PARTS <<< "$SUBDIR"
            for part in "${PARTS[@]}"; do
              PARENT_PATH="$DEPLOY_DIR${CURRENT:+/$CURRENT}"
              CURRENT="${CURRENT:+$CURRENT/}$part"
              DIR_KEY="$PARENT_PATH/$part"
              if [ -z "${SEEN_DIRS[$DIR_KEY]+x}" ]; then
                echo "→ mkdir: $DIR_KEY"
                curl -s -X POST "$HOST/execute/Fileman/mkdir" \
                  -H "Authorization: cpanel $CPANEL_USER:$TOKEN" \
                  --data-urlencode "dir=$PARENT_PATH" \
                  --data-urlencode "name=$part" > /dev/null 2>&1 || true
                SEEN_DIRS[$DIR_KEY]=1
              fi
            done
          done <<< "$FILES"

          # Upload all files via delete-first + multipart upload.
          # save_file_content is text-only and cannot create new files — upload_files
          # works for both binary and text, and creates files that don't yet exist.
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            SUBDIR=$(dirname "$file")
            if [ "$SUBDIR" = "." ]; then
              REMOTE_DIR="$DEPLOY_DIR"
            else
              REMOTE_DIR="$DEPLOY_DIR/$SUBDIR"
            fi
            FNAME=$(basename "$file")

            echo "→ Uploading: $file"

            # Delete existing file first (upload_files cannot overwrite)
            curl -s -X POST "$HOST/execute/Fileman/delete_files" \
              -H "Authorization: cpanel $CPANEL_USER:$TOKEN" \
              --data-urlencode "files-0-path=$REMOTE_DIR/$FNAME" \
              --data-urlencode "files-0-type=file" > /dev/null 2>&1 || true

            STATUS=$(curl -s -o result.json -w "%{http_code}" -X POST \
              "$HOST/execute/Fileman/upload_files" \
              -H "Authorization: cpanel $CPANEL_USER:$TOKEN" \
              -F "dir=$REMOTE_DIR" \
              -F "file-1=@$file")
            CPANEL_STATUS=$(jq -r 'if (.status == 1) and ((.data.failed // []) | length == 0) then "1" else "0" end' result.json 2>/dev/null || echo "0")

            if [ "$STATUS" != "200" ] || [ "$CPANEL_STATUS" != "1" ]; then
              echo "  ✖ FAILED (HTTP $STATUS, cPanel status $CPANEL_STATUS)"
              cat result.json
              FAILED=1
            else
              echo "  ✔ OK"
            fi
          done <<< "$FILES"

          if [ "$FAILED" = "1" ]; then
            echo "One or more files failed to upload."
            exit 1
          fi
